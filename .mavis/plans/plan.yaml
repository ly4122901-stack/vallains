    assigned_to: frontend-dev
    verified_by: tester
    verify_prompt: |
      Check LoginPage.jsx has:
      1. Google login button
      2. GitHub login button  
      3. Facebook login button
      4. Local email/password form
      5. Registration form
      6. Google account picker component
      7. Error handling
      8. Loading states
      Run: grep -c "Google\|GitHub\|Facebook" /workspace/vallains/frontend/src/pages/LoginPage.jsx

  - id: dashboard-page
    title: "📊 لوحة الفحص الرئيسية"
