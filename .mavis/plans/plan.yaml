      - Title: "مرحباً بك في Vallains" in Arabic
      - Subtitle: "سجّل الدخول للمتابعة"

      Social Login Buttons (3 buttons):
      - Google: Red #EA4335 background, white text, Google icon, "الدخول بجوجل"
      - GitHub: Dark #24292e background, white text, GitHub icon, "الدخول بجيت هاب"
      - Facebook: Blue #1877F2 background, white text, Facebook icon, "الدخول بفيسبوك"
