      Run: grep "comprehensive\|sql-injection\|xss\|open-redirect\|ssrf\|directory\|cmdi\|cors\|xxe" /workspace/vallains/frontend/src/pages/Dashboard.jsx | wc -l

  - id: results-viewer
    title: "📋 ResultsViewer - عرض النتائج بتفاصيل"
