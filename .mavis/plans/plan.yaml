  # ===== DEPLOYMENT =====
  - id: github-setup
    title: "🚀 إعداد GitHub ونشر المشروع"
    prompt: |
      Setup GitHub deployment for the full project.

      /workspace/vallains/.github/workflows/
      ├── backend.yml
      └── frontend.yml

      backend.yml:
      name: Deploy Backend
      on: push to main branch
      jobs:
        deploy:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                node-version: '18'
            - name: Install deps
              run: cd backend && npm ci
            - name: Run tests
              run: cd backend && npm test || echo "No tests yet"
            - name: Deploy to Railway
              env:
                RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
              run: |
                curl -fsSL https://railway.app/install.sh | sh
                railway login --token $RAILWAY_TOKEN
                railway up --service vallains-backend

      frontend.yml:
      name: Deploy Frontend
      on: push to main branch
      jobs:
        build-deploy:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                node-version: '18'
            - name: Install deps
              run: cd frontend && npm ci
            - name: Build
