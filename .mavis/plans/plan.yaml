version: 1
plan:
  name: "Vallains - بناء ماسح أمني full-stack"
  max_concurrency: 5
  max_cycles: 10
  auto_reject_retries: 1

tasks:
  # ===== BACKEND CORE =====
  - id: backend-project
    title: "⚙️ إعداد المشروع - Backend"
    prompt: |
      أنشئ هيكل المشروع الكامل في /workspace/vallains/backend/

      الملفات المطلوبة:
      /workspace/vallains/backend/package.json
      /workspace/vallains/backend/.env.example
      /workspace/vallains/backend/server.js
      /workspace/vallains/backend/config/passport.js
      /workspace/vallains/backend/config/database.js
      /workspace/vallains/backend/routes/auth.js
      /workspace/vallains/backend/routes/api.js
      /workspace/vallains/backend/middleware/auth.js
      /workspace/vallains/backend/services/scan-engine.js
      /workspace/vallains/backend/services/dns-resolver.js
      /workspace/vallains/backend/services/geoip.js
      /workspace/vallains/backend/services/ssl-checker.js
      /workspace/vallains/backend/services/port-scanner.js
      /workspace/vallains/backend/services/subdomain-finder.js
      /workspace/vallains/backend/services/blacklist-checker.js

      package.json يجب أن يتضمن:
      - express, cors, helmet, express-session
      - passport, passport-google-oauth20, passport-github2, passport-facebook
      - axios, jsonwebtoken, bcryptjs, uuid
      - socket.io (لـ real-time progress)
      - dns-socket

      server.js:
      - Enable CORS للـ frontend origin من env
      - Helmet security headers
      - express-session مع secret
      - Mount auth routes على /auth
      - Mount API routes على /api
      - Serve static من /public (frontend production build)
      - SPA fallback: serve index.html لأي route غير API
      - Error handling middleware
      - Listen على PORT

      .env.example:
      PORT=3000
      SESSION_SECRET=change_this_to_random_string
      FRONTEND_URL=http://localhost:5173
      GOOGLE_CLIENT_ID=
      GOOGLE_CLIENT_SECRET=
      GOOGLE_CALLBACK_URL=http://localhost:3000/auth/google/callback
      GITHUB_CLIENT_ID=
      GITHUB_CLIENT_SECRET=
      GITHUB_CALLBACK_URL=http://localhost:3000/auth/github/callback
      FACEBOOK_APP_ID=
      FACEBOOK_APP_SECRET=
      FACEBOOK_CALLBACK_URL=http://localhost:3000/auth/facebook/callback
      NODE_ENV=development

      database.js:
      - In-memory store أو JSON file persistence
      - User schema: { id, provider, providerId, email, name, avatar, createdAt }
      - Methods: findUser, createUser, updateUser, findByEmail

      middleware/auth.js:
      - requireAuth: checks session, returns 401 if not logged in
      - optionalAuth: continues even if not logged in

    assigned_to: developer
    verified_by: tester
    verify_prompt: |
      Check that all backend files exist and have content.
      ls /workspace/vallains/backend/ -- should show package.json, server.js, etc.
      cat /workspace/vallains/backend/package.json | python3 -c "import json,sys; d=json.load(sys.stdin); print('deps:', len(d.get('dependencies',{})))"
      Should be at least 12 dependencies.
      Check server.js has CORS, helmet, session, routes.

  - id: passport-auth
    title: "🔐 نظام OAuth - Google, GitHub, Facebook"
    prompt: |
      Implement OAuth authentication in /workspace/vallains/backend/

      config/passport.js:
      - GoogleStrategy: scope ['email', 'profile'], callback URL from env
      - GitHubStrategy: scope ['user:email'], handle emails from accounts
      - FacebookStrategy: scope ['email'], handle missing email
      - serializeUser/deserializeUser: store user ID in session
      - Handle case where email is null (use providerId@provider.com)

      routes/auth.js:
      GET /auth/google → passport.authenticate('google', { scope: ['email', 'profile'] })
      GET /auth/google/callback → handle callback, redirect to frontend with token
      GET /auth/github → passport.authenticate('github', { scope: ['user:email'] })
      GET /auth/github/callback → handle callback
      GET /auth/facebook → passport.authenticate('facebook', { scope: ['email'] })
      GET /auth/facebook/callback → handle callback
      POST /auth/login → local email/password login with bcrypt
      POST /auth/register → create local account
      GET /auth/logout → destroy session
      GET /auth/session → return current user info (or 401)
      GET /auth/accounts → return list of user's connected OAuth accounts

      After successful OAuth:
      - Create JWT token (sign with SESSION_SECRET)
      - Return token to frontend (as query param redirect or JSON)
      - Store token in localStorage on frontend

      Local auth fallback:
      - bcrypt hash passwords
      - JWT token generation on login
      - Token validation middleware

      Error handling:
      - If OAuth fails, return JSON { error: true, message: '...' }
      - Don't redirect to error pages, return JSON always

    assigned_to: developer
    verified_by: tester
    verify_prompt: |
      Check that:
      1. passport.js has all 3 strategies (Google, GitHub, Facebook)
      2. auth.js has all endpoints (google, github, facebook, login, register, logout, session)
      3. bcrypt is used for password hashing
      4. JWT tokens are generated
      Run: grep "GoogleStrategy\|GitHubStrategy\|FacebookStrategy" /workspace/vallains/backend/config/passport.js
      Run: grep "bcrypt\|jwt" /workspace/vallains/backend/routes/auth.js

  - id: scan-engine
    title: "🛡️ محرك الفحص - جميع الثغرات"
    prompt: |
      Build the scan engine and all vulnerability scanners in /workspace/vallains/backend/services/

      scan-engine.js - Main orchestrator:
      - scan(target, type, userId) function
      - Types: comprehensive, sql-injection, xss, open-redirect, ssrf, directory-traversal, cmdi, cors-misconfig, xxe, info, resolve, reverse, blacklist, ssl, ports, subdomains, redirects, reputation
      - comprehensive: runs ALL vulnerability scans sequentially
      - Returns: { success: true, target, type, timestamp, duration, results: {...}, summary: {...} }
      - Timeout per scan: 30 seconds
      - Error handling: try/catch, return error object on failure

      scanners/sql-injection.js:
      - Test URL: try adding ' to params like ?id=1', ?q=', ?search=' etc.
      - Payloads: ', ' OR '1'='1, ' OR '1'='1' --, admin'--
      - Check for: SQL errors in response (mysql, postgresql, oracle, sqlite errors)
      - Check for: content length differential
      - Also test headers: X-Forwarded-For, User-Agent with SQL payloads
      - Return: { vulnerable, payload, type: 'union/error/boolean', confidence: 'high/medium/low', parameter, location }

      scanners/xss.js:
      - Test params: <script>alert(1)</script>, <img src=x onerror=alert(1)>, <svg onload=alert(1)>
      - Check if payload is reflected unencoded
      - Test: reflected, stored (if form input), DOM-based
      - Return: { vulnerable, payload, type, location, confidence }

      scanners/open-redirect.js:
      - Test params: ?redirect=, ?url=, ?next=, ?dest=, ?checkout=, ?return=
      - Payloads: https://google.com, //google.com, ///google.com, javascript:alert(1)
      - Check if 3xx redirect to external domain without validation
      - Return: { vulnerable, payload, redirectTo, confidence }

      scanners/ssrf.js:
      - Test against internal targets:
        - http://169.254.169.254/latest/meta-data/ (AWS metadata)
        - http://localhost/, http://127.0.0.1/, http://[::1]/
        - http://0.0.0.0/
      - Check if server fetches internal resources
      - Return: { vulnerable, payload, internalResourceFound, confidence }

      scanners/directory-traversal.js:
      - Test: ?file=../../etc/passwd, ?path=../../../etc/passwd, ?page=..%2F..%2Fetc%2Fpasswd
      - Check for: root:x, /bin/bash, [boot loader] in response
      - Return: { vulnerable, payload, fileFound, confidence }

      scanners/cmdi.js:
      - Test: ?cmd=|ls, ?q=$(whoami), ?search=`id`, ?host=|cat /etc/hosts
      - Check for command output in response
      - Return: { vulnerable, payload, commandOutput, confidence }

      scanners/cors-misconfig.js:
      - Make requests with Origin header
      - Check Access-Control-Allow-Origin response header
      - Detect: wildcard *, credentials + any origin, null origin
      - Return: { vulnerable, misconfigType, allowedOrigin, confidence }

      scanners/xxe.js:
      - Send XXE payloads in XML body
      - Test: <?xml version="1.0"?><!DOCTYPE foo [<ENTITY xxe SYSTEM "file:///etc/passwd">]><foo>&xxe;</foo>
      - Check for file disclosure or XXE errors
      - Return: { vulnerable, payload, infoLeaked, confidence }

      All scanners:
      - async functions
      - Accept { url, params, method } object
      - Return structured JSON
      - Handle timeouts (use AbortController, 10s timeout)
      - Do NOT cause real harm (safe, read-only)

      dns-resolver.js:
      - resolveDomain(domain): returns { ipv4: [...], ipv6: [...], mx: [...], ns: [...], txt: [...], cname: [...] }
      - Uses Node.js dns module + fallback to axios for DNS-over-HTTPS (dns.google)

      geoip.js:
      - getGeoIP(ip): returns { country, city, region, isp, org, asn, lat, lon, timezone, hosting }

      ssl-checker.js:
      - checkSSL(domain): returns { issuer, subject, validFrom, validTo, daysLeft, sans: [], grade }
      - Uses tls.connect or axios to fetch certificate info

      port-scanner.js:
      - scanPorts(ip): scans common ports [21,22,23,25,53,80,110,143,443,465,587,993,995,1433,1521,3306,3389,5432,5900,6379,8080,8443,27017]
      - Returns: [{ port, service, status: 'open'|'closed' }]
      - Use net.connect with 2s timeout

      subdomain-finder.js:
      - findSubdomains(domain): uses crt.sh API (certificate transparency)
      - Returns: [{ subdomain, issuer, created }]
      - Also try DNS zone transfer if available

      blacklist-checker.js:
      - checkBlacklist(ip): check against DNSBL zones
      - Zones: zen.spamhaus.org, bl.spamcop.net, dnsbl.sorbs.net, uceprotect1.dnsbl.net.au
      - Returns: [{ zone, listed: true/false }]

    assigned_to: developer
    verified_by: tester
    verify_prompt: |
      Check that scanner files exist:
      ls /workspace/vallains/backend/services/scanners/
      Confirm: sql-injection.js, xss.js, open-redirect.js, ssrf.js, directory-traversal.js, cmdi.js, cors-misconfig.js, xxe.js
      Check scan-engine.js exports scan() function with 'comprehensive' type.
      Run: grep "async function\|export" /workspace/vallains/backend/services/scan-engine.js
      Run: grep "comprehensive" /workspace/vallains/backend/services/scan-engine.js

  - id: api-routes
    title: "🌐 API Routes - كل فحوصات الـ API"
    prompt: |
      Implement /workspace/vallains/backend/routes/api.js

      All routes require requireAuth middleware.

      GET /api/health
      Response: { status: 'ok', timestamp, uptime }

      GET /api/scan?target=example.com&type=sql-injection
      POST /api/scan (body: { target, type })
      - Validate target: must be valid domain or IP (use regex)
      - Validate type: must be in allowed list
      - Rate limit: track scans per user, max 10/minute
      - Call scanEngine.scan(target, type, userId)
      - Store scan result in history
      - Return results
      Response: { success, target, type, timestamp, duration, results: {...}, summary: { critical, high, medium, info, grade } }

      GET /api/scan/:id
      - Get scan result by ID
      - Only return if owned by current user

      GET /api/scan-history?limit=20&offset=0
      - Return recent scans for current user
      - Paginated

      GET /api/accounts
      - Return user's connected OAuth accounts

      POST /api/logout-all
      - Destroy all sessions for user

      Error responses:
      { error: true, code: 'INVALID_TARGET', message: '...' }
      { error: true, code: 'RATE_LIMITED', message: '...' }
      { error: true, code: 'UNAUTHORIZED', message: '...' }
      { error: true, code: 'SCAN_FAILED', message: '...' }

      Add at bottom:
      app.use((err, req, res, next) => {
        console.error(err.stack);
        res.status(500).json({ error: true, code: 'INTERNAL_ERROR', message: 'خطأ داخلي' });
      });

    assigned_to: developer
    verified_by: tester
    verify_prompt: |
      Check api.js has all endpoints:
      - GET /api/health
      - GET/POST /api/scan
      - GET /api/scan/:id
      - GET /api/scan-history
      - GET /api/accounts
      Run: grep "router\." /workspace/vallains/backend/routes/api.js | wc -l
      Should be at least 7 route definitions.
      Check requireAuth is used on protected routes.

  # ===== FRONTEND =====
  - id: frontend-setup
    title: "⚛️ إعداد React Frontend"
    prompt: |
      Create /workspace/vallains/frontend/ using Vite + React

      /workspace/vallains/frontend/
      ├── package.json
      ├── vite.config.js
      ├── index.html
      ├── public/
      └── src/
          ├── main.jsx
          ├── App.jsx
          ├── api/
          │   └── client.js
          ├── context/
          │   └── AuthContext.jsx
          ├── pages/
          │   ├── LoginPage.jsx
          │   ├── Dashboard.jsx
          │   └── ResultsPage.jsx
          ├── components/
          │   ├── GoogleAccountPicker.jsx
          │   ├── ScanCard.jsx
          │   ├── ResultsViewer.jsx
          │   ├── NavBar.jsx
          │   ├── Loader.jsx
          │   └── ComprehensiveScanModal.jsx
          └── styles/
              └── main.css

      package.json:
      - react, react-dom, react-router-dom v6
      - vite, @vitejs/plugin-react
      - axios
      - react-hot-toast
      - lucide-react (for icons)

      vite.config.js:
      - Plugin: @vitejs/plugin-react
      - Server: proxy /api → http://localhost:3000, /auth → http://localhost:3000
      - For production: define VITE_API_URL env

      index.html:
      - RTL, lang="ar"
      - Google Fonts: Cairo, Cinzel, JetBrains Mono
      - Title: "Vallains - ماسح أمني احترافي"

      App.jsx:
      - BrowserRouter
      - Routes: / → LoginPage, /dashboard → Dashboard (protected), /results/:id → ResultsPage (protected)
      - AuthContext.Provider wrapping Router
      - Toaster for notifications
      - On mount: check localStorage for token, fetch /auth/session to validate

      AuthContext.jsx:
      - State: user, isLoggedIn, loading
      - loginWithGoogle(): window.location.href = BACKEND_URL/auth/google
      - loginWithGitHub(): window.location.href = BACKEND_URL/auth/github
      - loginWithFacebook(): window.location.href = BACKEND_URL/auth/facebook
      - loginLocal(email, password): POST /auth/login, store token
      - register(name, email, password): POST /auth/register
      - logout(): clear token, redirect to /
      - fetchSession(): GET /auth/session to restore session from token
      - Token stored in localStorage as 'vallains_token'
      - Handle OAuth callback: detect ?token= in URL, store it, redirect to dashboard

      api/client.js:
      - baseURL from VITE_API_URL or localhost:3000
      - Axios instance with Authorization: Bearer {token}
      - Handle 401: clear token, redirect to /
      - Methods: login, register, getSession, scan, getScanHistory, getScanById, getAccounts, logoutAll

      THEME: Keep the existing Vallains dark gold aesthetic
      - Background: #050505, #0a0a0c, #111114
      - Gold: #D4AF37, #F5DEB3, #8B6F1F
      - Text: #f5f5f7, #d4d4d8, #a1a1aa
      - Font: Cairo (Arabic), Cinzel (English headers), JetBrains Mono (code)
      - Smooth animations, gold glows, luxury feel

    assigned_to: frontend-dev
    verified_by: tester
    verify_prompt: |
      Check:
      1. /workspace/vallains/frontend/package.json has react, react-router-dom, axios, vite
      2. /workspace/vallains/frontend/vite.config.js has proxy to localhost:3000
      3. /workspace/vallains/frontend/src/App.jsx has BrowserRouter
      4. /workspace/vallains/frontend/src/context/AuthContext.jsx exists with all login methods
      5. Theme colors match Vallains (#050505 bg, #D4AF37 gold)

