      - "تسجيل الدخول" button (gold gradient)
      - Error message display

      Registration Toggle:
      - "ليس لديك حساب؟ إنشاء حساب جديد"
      - Toggle to registration form:
        - Name input
        - Email input
        - Password input
        - Confirm password input
